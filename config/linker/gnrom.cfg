# Doraemon (Japan, original revision) complete iNES image layout.
#
# Mapper 66 switches one of four 32 KiB PRG banks into $8000-$FFFF.
# The linker emits the banks consecutively even though CPU ranges overlap.

MEMORY {
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    PRG0:   file = %O, start = $8000, size = $8000, fill = yes;
    PRG1:   file = %O, start = $8000, size = $8000, fill = yes;
    PRG2:   file = %O, start = $8000, size = $8000, fill = yes;
    PRG3:   file = %O, start = $8000, size = $8000, fill = yes;
    CHR:    file = %O, start = $0000, size = $8000, fill = yes;
}

SEGMENTS {
    HEADER: load = HEADER, type = ro;
    PRG0:   load = PRG0,   type = ro;
    PRG1:   load = PRG1,   type = ro;
    PRG2:   load = PRG2,   type = ro;
    PRG3:   load = PRG3,   type = ro;
    CHR:    load = CHR,    type = ro;
}
